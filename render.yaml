# Render blueprint: one free web service built from the Dockerfile.
# The database is a free external PostgreSQL (for example Neon); put its
# connection string in DB_URL. Secrets are never stored in this file.
services:
  - type: web
    name: pixelforge-studio
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: PIXELFORGE_API_KEY
        sync: false
      - key: PIXELFORGE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
